# Builds the VKS cluster overlay-public in the overlay Supervisor namespace (same pattern as
# demo-vks-cluster). targetRevision is the PR branch until PR #3 is merged.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: overlay-public-cluster
  namespace: argocd-demo-xxms8
spec:
  project: default
  source:
    repoURL: https://github.com/sorinplaton/vcf-gitops.git
    path: clusters/overlay-public
    targetRevision: tepless-vks
  destination:
    server: https://kubernetes.default.svc/?context=podinfo-demo-dx643
    namespace: podinfo-demo-dx643
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
