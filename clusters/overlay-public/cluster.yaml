# Overlay twin of clusters/demo-git: same release, image, VM classes and size, but in the
# OVERLAY workload domain (east-1, VPC with TEPs). Its nodes use the overlay VPC's PUBLIC
# SubnetSet (platform/overlay-public/subnetset-public.yaml), so they are routable like demo-git's.
# Built by the Argo CD Application argocd-apps/overlay-public-cluster.yaml.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: overlay-public
  namespace: podinfo-demo-dx643
spec:
  clusterNetwork:
    pods:
      cidrBlocks: [100.96.0.0/11]
    services:
      cidrBlocks: [100.64.0.0/13]
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.7.0
      namespace: vmware-system-vks-public
    version: v1.36.2+vmware.2-vkr.3   # from: kubectl get kr
    controlPlane:
      replicas: 1
      metadata:
        annotations:
          run.tanzu.vmware.com/resolve-os-image: os-name=ubuntu,os-version=24.04
    workers:
      machineDeployments:
      - class: node-pool
        name: np-1
        replicas: 1
        metadata:
          annotations:
            run.tanzu.vmware.com/resolve-os-image: os-name=ubuntu,os-version=24.04
        variables:
          overrides:
          - name: vmClass
            value: best-effort-medium
    variables:
    - name: vmClass
      value: best-effort-small
    - name: storageClass
      value: cluster-wld01-01a-vsan-storage-policy
    - name: networks
      value:
        interfaces:
          primary:
            network:
              apiVersion: crd.nsx.vmware.com/v1alpha1
              kind: SubnetSet
              name: public
