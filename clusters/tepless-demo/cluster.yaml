# VKS cluster on the TEP-less (VLAN-backed VPC) workload domain. NOT applied yet and
# NOT watched by Argo CD. Prerequisite: a Kubernetes Service content library on the
# Supervisor sup-wld02-tepless (the namespace lists no KubernetesReleases until then).
# The "networks" variable (checked against builtin-generic-v3.7.0 on this Supervisor)
# puts the nodes on the public SubnetSet; the default private network is refused in a
# VLAN-backed VPC ("cannot use the default private network in a VPC namespace without SNAT").
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: tepless-demo
  namespace: tepless-demo-4tvk7
spec:
  clusterNetwork:
    pods:
      cidrBlocks: [100.96.0.0/11]
    services:
      cidrBlocks: [100.64.0.0/13]
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.7.0
      namespace: vmware-system-vks-public
    version: v1.35.5+vmware.1-vkr.1   # pick from: kubectl get kr
    controlPlane:
      replicas: 1
      metadata:
        annotations:
          run.tanzu.vmware.com/resolve-os-image: os-name=photon
    workers:
      machineDeployments:
      - class: node-pool
        name: np-1
        replicas: 2
        metadata:
          annotations:
            run.tanzu.vmware.com/resolve-os-image: os-name=photon
        variables:
          overrides:
          - name: vmClass
            value: best-effort-medium
    variables:
    - name: vmClass
      value: best-effort-small
    - name: storageClass
      value: cluster-tepless-vsan-storage-policy
    - name: networks
      value:
        interfaces:
          primary:
            network:
              apiVersion: crd.nsx.vmware.com/v1alpha1
              kind: SubnetSet
              name: public
