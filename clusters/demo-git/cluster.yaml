# VKS cluster on the TEP-less (VLAN-backed VPC) workload domain, applied from Git with kubectl
# (see platform/tepless/README.md). NOT watched by Argo CD. 1 control plane + 1 worker so it fits
# the namespace memory limit (32 GiB) next to tepless-demo, which was built in the VCF Automation UI.
# Prerequisite: the Supervisor sup-wld02-tepless needs a Kubernetes Service content library
# (set 2026-10-20: subscribed library "VKS", on demand). Releases after v1.35.0 are Ubuntu-only.
# The "networks" variable (checked against builtin-generic-v3.7.0 on this Supervisor)
# puts the nodes on the public SubnetSet; the default private network is refused in a
# VLAN-backed VPC ("cannot use the default private network in a VPC namespace without SNAT").
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: demo-git
  namespace: tepless-demo-4tvk7
spec:
  clusterNetwork:
    pods:
      cidrBlocks: [100.96.0.0/11]
    services:
      cidrBlocks: [100.64.0.0/13]
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.7.0
      namespace: vmware-system-vks-public
    version: v1.36.2+vmware.2-vkr.3   # from: kubectl get kr; v1.35.6+ ship Ubuntu node images only
    controlPlane:
      replicas: 1
      metadata:
        annotations:
          run.tanzu.vmware.com/resolve-os-image: os-name=ubuntu
    workers:
      machineDeployments:
      - class: node-pool
        name: np-1
        replicas: 1
        metadata:
          annotations:
            run.tanzu.vmware.com/resolve-os-image: os-name=ubuntu
        variables:
          overrides:
          - name: vmClass
            value: best-effort-medium
    variables:
    - name: vmClass
      value: best-effort-small
    - name: storageClass
      value: cluster-tepless-vsan-storage-policy
    - name: networks
      value:
        interfaces:
          primary:
            network:
              apiVersion: crd.nsx.vmware.com/v1alpha1
              kind: SubnetSet
              name: public
