# Argo CD + monitoring for the platform-ops org: its own VPC in region mgmt-a (management domain).
# Applied as platform-admin@platform-ops through the VCF Automation CCI API (apply.sh network).
apiVersion: vpc.nsx.vmware.com/v1alpha1
kind: VPC
metadata:
  name: vpc-platform-ops
  namespace: default-project
spec:
  description: platform-ops GitOps + monitoring (Argo CD as a VCF Service, tech preview)
  projectName: default-project
  regionName: mgmt-a
  # private block for VKS node subnets (without it NSX error 610711 "Private ip blocks are not
  # configured in parent VPC" and the cluster VMs never get a NIC)
  privateIPs: [172.24.0.0/23]
