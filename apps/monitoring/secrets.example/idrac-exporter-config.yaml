# Create ONCE in the mon-mgmt cluster from a local copy with the real password (never commit it):
#   kubectl --context mon-mgmt -n monitoring create secret generic idrac-exporter-config --from-file=idrac.yml=./idrac.yml
# The exporter reads the iDRAC named by ?target=<ip>; both Dells share the same local account here.
apiVersion: v1
kind: Secret
metadata:
  name: idrac-exporter-config
  namespace: monitoring
type: Opaque
stringData:
  idrac.yml: |
    address: 0.0.0.0
    port: 9348
    timeout: 20
    hosts:
      default:
        username: monitor
        password: "<password>"
    metrics:
      system: {enabled: true}
      sensors: {enabled: true}
      power: {enabled: true}
      processors: {enabled: true}
      memory: {enabled: true}
      storage: {enabled: true}
      network: {enabled: false}
      events: {enabled: true, severity: warning, maxage: 168h}
